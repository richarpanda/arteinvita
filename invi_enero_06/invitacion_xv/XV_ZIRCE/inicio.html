<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mis XV</title>

  <!-- WIDGET ARTE INVITA (para ArteInvita.open) -->
  <script src="https://app.arteinvita.com/widget.js"></script>

  <!-- FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root{
      --white: rgba(255,255,255,.96);
      --soft: rgba(255,255,255,.7);
      --line: rgba(255,255,255,.55);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; }

    body{
      background:#0b0b0b;
      font-family:"Montserrat", sans-serif;
      color:var(--white);
    }

    .poster{
      width:100vw;
      height:100vh;
      position:relative;
      overflow:hidden;
    }

    .poster::before{
      content:"";
      position:absolute;
      inset:0;
      background:url("PORTADA.jpeg") center center / cover no-repeat;
      filter: contrast(1.05) saturate(.95);
      transform: scale(1.05);
      z-index:0;
    }

    .poster::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(
        to bottom,
        rgba(0,0,0,.45),
        rgba(0,0,0,.4),
        rgba(0,0,0,.45)
      );
      z-index:1;
    }

    .content{
      position:absolute;
      inset:0;
      z-index:2;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:0 26px;
      gap:18px;
      transform: translateY(-4vh);
    }

    .word{
      font-family:"Playfair Display", serif;
      font-size:clamp(34px,4.5vw,46px);
      letter-spacing:.18em;
      text-transform:uppercase;
    }

    .the-row{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
      margin:14px 0;
    }

    .line{
      height:1px;
      width:min(120px,26vw);
      background:var(--line);
    }

    .the{
      font-family:"Great Vibes", cursive;
      font-size:32px;
      color:var(--soft);
    }

    .xv{
      font-family:"Great Vibes", cursive;
      font-size:clamp(42px,8vw,58px);
      letter-spacing:.08em;
    }

    .name{
      font-size:14px;
      letter-spacing:.32em;
      text-transform:uppercase;
      color:var(--soft);
    }

    .name_2{
      font-family:"Great Vibes", cursive;
      font-size:40px;
    }

    .countdown{
      display:flex;
      gap:18px;
      font-family:"Playfair Display", serif;
    }

    .time-box{
      text-align:center;
      min-width:62px;
    }

    .num{
      font-size:clamp(22px,3.5vw,28px);
      letter-spacing:.12em;
    }

    .label{
      font-size:10px;
      letter-spacing:.28em;
      text-transform:uppercase;
      color:var(--soft);
    }

    /* CONFIRMACIÓN */
    .confirm-box{
      margin-top:14px;
      text-align:center;
    }

    .confirm-text{
      font-family:"Playfair Display", serif;
      font-size:15px;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:var(--soft);
      line-height:1.4;
    }

    /* PANEL INTERACTIVO */
    .panel{
      margin-top:14px;
      padding:14px 22px;
      font-size:13px;
      letter-spacing:.28em;
      text-transform:uppercase;
      color:var(--white);
      border:1px solid var(--line);
      display:inline-block;
      cursor:pointer;
      transition:all .35s ease;
      position:relative;
      background: transparent;
    }

    .panel::before,
    .panel::after{
      content:"";
      position:absolute;
      width:0;
      height:1px;
      background:var(--white);
      transition:width .35s ease;
    }

    .panel::before{
      top:-6px;
      left:0;
    }

    .panel::after{
      bottom:-6px;
      right:0;
    }

    .panel:hover{
      letter-spacing:.34em;
      box-shadow:0 0 12px rgba(255,255,255,.25);
    }

    .panel:hover::before,
    .panel:hover::after{
      width:100%;
    }

    /* BOTÓN SOLO LÍNEAS */
    .line-btn{
      margin-top:18px;
      display:inline-flex;
      align-items:center;
      gap:14px;
      background:none;
      border:none;
      color:var(--white);
      font-family:"Montserrat", sans-serif;
      font-size:12px;
      letter-spacing:.28em;
      text-transform:uppercase;
      cursor:pointer;
      transition:opacity .3s ease;
      padding: 0;
    }

    .line-btn::before,
    .line-btn::after{
      content:"";
      height:1px;
      width:60px;
      background:var(--line);
      transition:background .3s ease;
    }

    .line-btn:hover{
      opacity:.85;
    }

    .line-btn:hover::before,
    .line-btn:hover::after{
      background:var(--white);
    }

    .fade{
      opacity:0;
      transform:translateY(10px);
      animation:fadeUp .9s ease forwards;
    }

    .d2{animation-delay:.15s}
    .d3{animation-delay:.3s}
    .d4{animation-delay:.45s}

    @keyframes fadeUp{
      to{opacity:1;transform:none;}
    }
  </style>
</head>

<body>

<section class="poster">
  <div class="content">

    <div class="fade d2">
      <div class="word">Confirma</div>
      <div class="the-row">
        <span class="line"></span>
        <span class="the">tú</span>
        <span class="line"></span>
      </div>
      <div class="word">Asistencia</div>
    </div>

    <div class="fade d3">
      <div class="xv">Mis XV</div>
      <div class="name_2">Zirce Yamile</div>
      <div class="name">21.02.2026</div>
    </div>

    <div class="countdown fade d4" id="countdown">
      <div class="time-box">
        <div class="num" id="days">00</div>
        <div class="label">DÍAS</div>
      </div>
      <div class="time-box">
        <div class="num" id="hours">00</div>
        <div class="label">HORAS</div>
      </div>
      <div class="time-box">
        <div class="num" id="minutes">00</div>
        <div class="label">MIN</div>
      </div>
      <div class="time-box">
        <div class="num" id="seconds">00</div>
        <div class="label">SEG</div>
      </div>
    </div>

    <div class="name">17:30 HRS</div>

    <!-- CONFIRMACIÓN -->
    <div class="confirm-box fade d3">
      <p class="confirm-text">
        Confirma tu asistencia para acompañarnos<br>
        en este día tan especial y descarga tu boleto QR
      </p>

      <button class="panel" onclick="ArteInvita.open('1BC-9E8E-252')">
        Panel de Confirmación
      </button>

      <button class="line-btn" onclick="ArteInvita.open('')">
        Confirmar
      </button>
    </div>

  </div>
</section>

<script>
  const eventDate = new Date(2026,1,21,5,30,0);

  const daysEl = document.getElementById("days");
  const hoursEl = document.getElementById("hours");
  const minutesEl = document.getElementById("minutes");
  const secondsEl = document.getElementById("seconds");

  function updateCountdown(){
    const now = Date.now();
    const distance = eventDate - now;

    if(distance <= 0){
      daysEl.textContent = "00";
      hoursEl.textContent = "00";
      minutesEl.textContent = "00";
      secondsEl.textContent = "00";
      return;
    }

    const days = Math.floor(distance / (1000*60*60*24));
    const hours = Math.floor((distance / (1000*60*60)) % 24);
    const minutes = Math.floor((distance / (1000*60)) % 60);
    const seconds = Math.floor((distance / 1000) % 60);

    daysEl.textContent = String(days).padStart(2,"0");
    hoursEl.textContent = String(hours).padStart(2,"0");
    minutesEl.textContent = String(minutes).padStart(2,"0");
    secondsEl.textContent = String(seconds).padStart(2,"0");
  }

  updateCountdown();
  setInterval(updateCountdown,1000);
</script>

</body>
</html>
