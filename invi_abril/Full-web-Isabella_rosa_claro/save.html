<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recordatorio | Issabella Miranda</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --white: rgba(255,255,255,.96);
      --soft: rgba(255,255,255,.76);
      --line: rgba(255,255,255,.55);
      --pink: #e79db8;
      --gold: #c9a24f;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      background: #171014;
      color: var(--white);
      font-family: "Montserrat", sans-serif;
    }

    .poster {
      min-height: 100vh;
      width: 100%;
      position: relative;
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    .poster::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url("img/fondosave.jpg") center center / cover no-repeat;
      filter: saturate(.9) contrast(1.03);
      transform: scale(1.04);
    }

    .poster::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom, rgba(20, 8, 14, .72), rgba(20, 8, 14, .42), rgba(20, 8, 14, .74));
    }

    .content {
      position: relative;
      z-index: 1;
      width: min(620px, 100%);
      padding: 42px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      transform: translateY(-2vh);
    }

    .kicker {
      font-family: "Playfair Display", serif;
      font-size: clamp(18px, 4vw, 24px);
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--soft);
    }

    .name {
      font-family: "Great Vibes", cursive;
      font-size: clamp(68px, 18vw, 118px);
      line-height: .9;
      text-shadow: 0 12px 34px rgba(0,0,0,.38);
    }

    .event {
      font-family: "Playfair Display", serif;
      font-size: clamp(16px, 4vw, 22px);
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--soft);
    }

    .divider {
      width: min(260px, 72vw);
      height: 1px;
      background: var(--line);
      margin: 2px 0;
    }

    .message {
      font-family: "Great Vibes", cursive;
      font-size: clamp(34px, 8vw, 54px);
      color: rgba(255,255,255,.88);
      line-height: 1.05;
    }

    .countdown {
      width: min(470px, 100%);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 4px;
    }

    .time-box {
      min-width: 0;
      padding: 14px 8px 12px;
      border: 1px solid rgba(255,255,255,.36);
      background: rgba(255,255,255,.10);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 14px 32px rgba(0,0,0,.20);
    }

    .num {
      font-family: "Playfair Display", serif;
      font-size: clamp(24px, 7vw, 34px);
      line-height: 1;
      letter-spacing: .06em;
    }

    .label {
      margin-top: 7px;
      font-size: 10px;
      letter-spacing: .17em;
      text-transform: uppercase;
      color: rgba(255,255,255,.72);
    }

    .date {
      font-size: 12px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(255,255,255,.72);
    }

    .invitation-btn {
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 28px;
      border: 1px solid rgba(255,255,255,.58);
      border-radius: 999px;
      background: rgba(231,157,184,.30);
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .2em;
      text-transform: uppercase;
      box-shadow: 0 14px 34px rgba(0,0,0,.24);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform .25s ease, background .25s ease, box-shadow .25s ease;
    }

    .invitation-btn:hover {
      transform: translateY(-2px);
      background: rgba(231,157,184,.48);
      box-shadow: 0 18px 42px rgba(0,0,0,.30);
    }

    .fade {
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp .9s ease forwards;
    }

    .d2 { animation-delay: .12s; }
    .d3 { animation-delay: .24s; }
    .d4 { animation-delay: .36s; }
    .d5 { animation-delay: .48s; }

    @keyframes fadeUp {
      to { opacity: 1; transform: none; }
    }

    @media (max-width: 430px) {
      .content { gap: 15px; padding: 34px 18px; }
      .countdown { gap: 7px; }
      .time-box { padding: 12px 5px 10px; }
      .label { font-size: 9px; letter-spacing: .12em; }
      .invitation-btn { width: min(320px, 100%); padding: 0 18px; }
    }
  </style>
</head>

<body>
  <section class="poster">
    <div class="content">
      <div class="kicker fade">Ya falta poco</div>

      <div class="fade d2">
        <div class="name">Issabella Miranda</div>
        <div class="event">Mis XV Años</div>
      </div>

      <div class="divider fade d3"></div>
      <div class="message fade d3">La fecha está cada vez más cerca</div>

      <div class="countdown fade d4" id="countdown" aria-label="Cuenta regresiva">
        <div class="time-box">
          <div class="num" id="days">00</div>
          <div class="label">Días</div>
        </div>
        <div class="time-box">
          <div class="num" id="hours">00</div>
          <div class="label">Horas</div>
        </div>
        <div class="time-box">
          <div class="num" id="minutes">00</div>
          <div class="label">Min</div>
        </div>
        <div class="time-box">
          <div class="num" id="seconds">00</div>
          <div class="label">Seg</div>
        </div>
      </div>

      <div class="date fade d4">Sábado 25 de julio de 2026</div>

      <a class="invitation-btn fade d5" href="invitacion.html">
        Ver invitación
      </a>
    </div>
  </section>

  <script>
    const eventDate = new Date(2026, 6, 25, 17, 0, 0);

    const daysEl = document.getElementById("days");
    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const secondsEl = document.getElementById("seconds");

    function pad2(value) {
      return String(value).padStart(2, "0");
    }

    function updateCountdown() {
      const distance = eventDate.getTime() - Date.now();

      if (distance <= 0) {
        daysEl.textContent = "00";
        hoursEl.textContent = "00";
        minutesEl.textContent = "00";
        secondsEl.textContent = "00";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      daysEl.textContent = pad2(days);
      hoursEl.textContent = pad2(hours);
      minutesEl.textContent = pad2(minutes);
      secondsEl.textContent = pad2(seconds);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
