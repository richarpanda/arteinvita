<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Save the Date | Sofía</title>

  <!-- FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root{
      --white: rgba(255,255,255,.96);
      --soft: rgba(255,255,255,.7);
      --line: rgba(255,255,255,.55);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; }

    body{
      background:#0b0b0b;
      font-family:"Montserrat", sans-serif;
      color:var(--white);
      padding:0;
    }

    .poster{
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      border-radius: 0;
    }

    .poster::before{
      content:"";
      position:absolute;
      inset:0;
      background:url("portada.jpeg") center center / cover no-repeat;
      filter: contrast(1.05) saturate(.95);
      transform: scale(1.05);
      z-index:0;
    }

    .poster::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(
        to bottom,
        rgba(0,0,0,.55),
        rgba(0,0,0,.4),
        rgba(0,0,0,.55)
      );
      z-index:1;
    }

    /* ✅ CENTRADO REAL + CENTRADO VISUAL */
    .content{
      position:absolute;
      inset:0;
      z-index:2;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;

      text-align:center;
      padding: 0 26px;

      gap: 18px;                 /* controla el espaciado entre bloques */
      transform: translateY(-4vh);/* ajuste visual premium */
    }

    /* SAVE THE DATE */
    .word{
      font-family:"Playfair Display", serif;
      font-size:clamp(34px,4.5vw,46px);
      letter-spacing:.18em;
      text-transform:uppercase;
      line-height: 1.05;
    }

    .the-row{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
      margin:14px 0;
    }

    .line{
      height:1px;
      width:min(120px,26vw);
      background:var(--line);
    }

    .the{
      font-family:"Great Vibes", cursive;
      font-size:32px;
      color:var(--soft);
      line-height: 1;
    }

    /* XV */
    .xv{
      margin-top: 8px;
      font-family:"Great Vibes", cursive;
      font-size:clamp(42px,8vw,58px);
      letter-spacing:.08em;
      line-height: 1;
    }

    .name{
      margin-top:6px;
      font-size:18px;
      letter-spacing:.32em;
      text-transform:uppercase;
      color:var(--soft);
    }
	  
	  .name2{
      margin-top:6px;
      font-size:22px;
      letter-spacing:.32em;
      text-transform:uppercase;
      color:var(--soft);
    }
	  
	   .name_2{
      margin-top:6px;
	  font-family:"Great Vibes", cursive;
      font-size:40px;
     
      
    }

    /* COUNTDOWN */
    .countdown{
      margin-top: 8px;
      display:flex;
      gap:18px;
      font-family:"Playfair Display", serif;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap; /* por si en móvil necesita bajar */
    }

    .time-box{
      text-align:center;
      min-width: 62px;
    }

    .num{
      font-size:clamp(22px,3.5vw,28px);
      letter-spacing:.12em;
      line-height: 1.1;
    }

    .label{
      font-size:10px;
      letter-spacing:.28em;
      text-transform:uppercase;
      
      margin-top:4px;
    }

    /* ✅ Quitamos margin-top:auto para que NO se vaya abajo */
    .note{
      margin-top: 10px;
      font-family:"Great Vibes", cursive;
      font-size:clamp(30px,2.6vw,22px);
      color:rgba(255,255,255,.55);
      line-height: 1.2;
    }

    .hotel-info{
      margin-top: -2px;
      max-width: min(560px, 92vw);
      font-size: 10px;
      line-height: 1.7;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: rgba(255,255,255,.72);
    }

    .hotel-info .hotel-title{
      font-family:"Playfair Display", serif;
      font-size: 12px;
      letter-spacing: .2em;
      margin-bottom: 2px;
    }


    /* BOTÓN WHATSAPP */
    .whatsapp-confirm{
      margin-top: 12px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding: 12px 24px;
      border:1px solid rgba(255,255,255,.55);
      border-radius:999px;
      color:rgba(255,255,255,.94);
      text-decoration:none;
      font-family:"Montserrat", sans-serif;
      font-size:12px;
      font-weight:400;
      letter-spacing:.22em;
      text-transform:uppercase;
      background:rgba(255,255,255,.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow:0 10px 28px rgba(0,0,0,.22);
      transition:all .35s ease;
    }

    .whatsapp-confirm:hover{
      background:rgba(255,255,255,.18);
      transform:translateY(-2px);
      box-shadow:0 14px 34px rgba(0,0,0,.28);
    }

    .whatsapp-icon{
      width:17px;
      height:17px;
      flex:0 0 auto;
      opacity:.95;
    }



    /* BOTÓN DISCRETO DE MÚSICA */
    .music-toggle{
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 20;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.48);
      background: rgba(0,0,0,.28);
      color: rgba(255,255,255,.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 10px 26px rgba(0,0,0,.25);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all .3s ease;
      opacity: .88;
    }

    .music-toggle:hover{
      background: rgba(255,255,255,.16);
      transform: translateY(-2px);
      opacity: 1;
    }

    .music-toggle svg{
      width: 18px;
      height: 18px;
      display: block;
    }

    .music-toggle .pause-icon{ display:none; }
    .music-toggle.playing .play-icon{ display:none; }
    .music-toggle.playing .pause-icon{ display:block; }


    /* ANIMATION */
    .fade{
      opacity:0;
      transform:translateY(10px);
      animation:fadeUp .9s ease forwards;
    }
    .d2{ animation-delay:.15s }
    .d3{ animation-delay:.3s }
    .d4{ animation-delay:.45s }
    .d5{ animation-delay:.6s }

    @keyframes fadeUp{
      to{ opacity:1; transform:none; }
    }

    /* Ajuste visual para pantallas altas */
    @media (min-height: 800px){
      .content{ transform: translateY(-6vh); }
    }

    /* Ajuste para pantallas pequeñas */
    @media (max-width: 420px){
      .content{ gap: 14px; transform: translateY(-3vh); }
      .name{ letter-spacing: .24em; }
      .countdown{ gap: 14px; }
      .time-box{ min-width: 58px; }
    }
  </style>
</head>

<body>

<section class="poster">
  <audio id="bgMusic" src="cancion.mp3" preload="auto" loop></audio>

  <button class="music-toggle" id="musicToggle" type="button" aria-label="Reproducir o pausar música">
    <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="currentColor" d="M8 5v14l11-7z"/>
    </svg>
    <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="currentColor" d="M6 5h4v14H6zm8 0h4v14h-4z"/>
    </svg>
  </button>

  <div class="content">

      <div class="the-row">
        <span class="line"></span>
        <span class="the">the</span>
        <span class="line"></span>
      </div>

      <div class="word">DATE</div>
    </div>

    <div class="fade d3">
      <div class="xv">Mis XV</div>
      <div class="name_2">Sofía</div>
		<div class="name">27.MAR.2027</div>
		<div class="name">Sábado de Gloria</div>
		
    </div>

    <!-- COUNTDOWN -->
    <div class="countdown fade d4" id="countdown">
      <div class="time-box">

      </div>
      <div class="time-box">
        <div class="num" id="seconds">00</div>
        <div class="label">SEG</div>
      </div>
		

		
    </div>
	  
	  <div class="name"><strong>Ambia Terraza Jardín</strong>
</div>
	

    <div class="hotel-info fade d5">
      <div class="hotel-title">Sugerencia de Hoteles</div>
      <div>Hotel Platinium Gran Hotel - 3336836342</div>
      <div>Hotel Boutique Casa Tastuan - 3731041351</div>
    </div>

    <div class="note fade d3">El gran día se acerca</div>

<script>
  /* ===============================
     CONFIGURA AQUÍ LA FECHA
     Formato: Año, Mes-1, Día, Hora
     =============================== */
  const eventDate = new Date(2027, 2, 27, 00, 00, 0); // 27 Marzo 2027

  const daysEl = document.getElementById("days");
  const hoursEl = document.getElementById("hours");
  const minutesEl = document.getElementById("minutes");
  const secondsEl = document.getElementById("seconds");

  function updateCountdown(){
    const now = Date.now();
    const distance = eventDate.getTime() - now;

    if(distance <= 0){
      daysEl.textContent = "00";
      hoursEl.textContent = "00";
      minutesEl.textContent = "00";
      secondsEl.textContent = "00";
      return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    daysEl.textContent = String(days).padStart(2,"0");
    hoursEl.textContent = String(hours).padStart(2,"0");
    minutesEl.textContent = String(minutes).padStart(2,"0");
    secondsEl.textContent = String(seconds).padStart(2,"0");
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);


  /* ===============================
     MÚSICA AUTOMÁTICA + BOTÓN PLAY/PAUSE
     Archivo requerido en la misma carpeta: cancion.mp3
     =============================== */
  const bgMusic = document.getElementById("bgMusic");
  const musicToggle = document.getElementById("musicToggle");
  let musicStarted = false;

  bgMusic.volume = 0.75;

  function setMusicButtonState(){
    if(!bgMusic.paused){
      musicToggle.classList.add("playing");
      musicToggle.setAttribute("aria-label", "Pausar música");
    }else{
      musicToggle.classList.remove("playing");
      musicToggle.setAttribute("aria-label", "Reproducir música");
    }
  }

  async function playMusic(){
    try{
      await bgMusic.play();
      musicStarted = true;
      setMusicButtonState();
    }catch(error){
      setMusicButtonState();
    }
  }

  function pauseMusic(){
    bgMusic.pause();
    setMusicButtonState();
  }

  musicToggle.addEventListener("click", function(event){
    event.stopPropagation();
    if(bgMusic.paused){
      playMusic();
    }else{
      pauseMusic();
    }
  });

  // Intento de autoplay al cargar.
  window.addEventListener("load", playMusic);

  // Desbloqueo para celulares/iPhone: inicia en el primer toque del usuario.
  ["click", "touchstart"].forEach(function(evt){
    document.addEventListener(evt, function unlockMusic(){
      if(!musicStarted){
        playMusic();
      }
    }, { once:true, passive:true });
  });

  bgMusic.addEventListener("play", setMusicButtonState);
  bgMusic.addEventListener("pause", setMusicButtonState);

</script>

</body>
