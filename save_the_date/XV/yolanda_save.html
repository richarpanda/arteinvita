<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Save the Date</title>

  <!-- FONTS (similar vibe) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root{
      --overlay: rgba(0,0,0,.42);
      --white: rgba(255,255,255,.96);
      --white-soft: rgba(255,255,255,.75);
      --line: rgba(255,255,255,.55);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: "Montserrat", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#0b0b0b;
      color: var(--white);
      display:grid;
      place-items:center;
      padding: 18px;
    }

    /* CARD / POSTER */
    .poster{
      width: min(520px, 100%);
      aspect-ratio: 4 / 5;              /* parecido al pin */
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.55);
      isolation: isolate;
      background: #111;
    }

    /* background photo */
    .poster::before{
      content:"";
      position:absolute; inset:0;
      background:
        url("img/bg.jpg") center/cover no-repeat;
      transform: scale(1.03);
      filter: contrast(1.05) saturate(.95);
      z-index:0;
    }

    /* dark overlay */
    .poster::after{
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,.55) 0%,
        rgba(0,0,0,.40) 35%,
        rgba(0,0,0,.45) 70%,
        rgba(0,0,0,.60) 100%
      );
      z-index:1;
    }

    /* subtle vignette */
    .vignette{
      position:absolute; inset:-2px;
      background: radial-gradient(circle at 50% 35%, rgba(255,255,255,.06), rgba(0,0,0,.62) 70%);
      z-index:2;
      pointer-events:none;
      mix-blend-mode: overlay;
      opacity:.7;
    }

    .content{
      position:absolute; inset:0;
      z-index:3;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding: 42px 26px;
      text-align:center;
    }

    /* TOP: SAVE / DATE */
    .title{
      width: 100%;
      margin-top: 8px;
    }

    .word{
      font-family: "Playfair Display", serif;
      text-transform: uppercase;
      letter-spacing: .18em;
      font-weight: 500;
      font-size: clamp(34px, 4.5vw, 46px);
      line-height: 1;
    }

    .the-row{
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 14px;
      margin: 14px 0 12px;
      width: 100%;
      opacity: .95;
    }

    .the-row .line{
      height:1px;
      width: min(120px, 26vw);
      background: var(--line);
    }

    .the-row .the{
      font-family: "Great Vibes", cursive;
      font-size: clamp(26px, 3.5vw, 34px);
      color: var(--white-soft);
      transform: translateY(-2px);
      letter-spacing: .02em;
    }

    /* MIDDLE: names + ampersand */
    .names{
      margin-top: 34px;
      width: 100%;
      display:grid;
      grid-template-columns: 1fr auto 1fr;
      align-items:center;
      gap: 14px;
    }

    .person{
      font-size: 12px;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: rgba(255,255,255,.82);
      line-height: 1.35;
    }

    .amp{
      font-family: "Great Vibes", cursive;
      font-size: clamp(64px, 10vw, 96px);
      color: rgba(255,255,255,.96);
      line-height: 1;
      filter: drop-shadow(0 14px 30px rgba(0,0,0,.35));
      transform: translateY(2px);
    }

    /* DATE */
    .date{
      margin-top: 30px;
      font-family: "Playfair Display", serif;
      font-size: clamp(20px, 3.2vw, 28px);
      letter-spacing: .22em;
      color: rgba(255,255,255,.9);
    }

    /* FOOT NOTE */
    .note{
      margin-top: auto;
      padding-bottom: 14px;
      font-family: "Great Vibes", cursive;
      font-size: clamp(18px, 2.6vw, 22px);
      color: rgba(255,255,255,.58);
      letter-spacing: .02em;
    }

    /* tiny decorative top spacing */
    .spacer{
      height: 8px;
    }

    /* fade-in */
    .fade{
      opacity:0;
      transform: translateY(10px);
      animation: in .9s ease forwards;
    }
    .fade.d2{ animation-delay: .15s; }
    .fade.d3{ animation-delay: .30s; }
    .fade.d4{ animation-delay: .45s; }
    .fade.d5{ animation-delay: .60s; }

    @keyframes in{
      to{ opacity:1; transform: translateY(0); }
    }

    /* mobile safe */
    @media (max-width: 420px){
      .content{ padding: 36px 18px; }
      .names{ gap: 10px; }
      .person{ letter-spacing: .20em; font-size: 11px; }
    }
  </style>
</head>

<body>
  <!--
    INSTRUCCIONES RÁPIDAS:
    1) Pon tu foto en: img/bg.jpg
    2) Cambia nombres y fecha en el HTML
  -->

  <section class="poster" aria-label="Save the Date">
    <div class="vignette"></div>

    <div class="content">
      <div class="title fade d2">
        <div class="word">SAVE</div>

        <div class="the-row">
          <span class="line"></span>
          <span class="the">the</span>
          <span class="line"></span>
        </div>

        <div class="word">DATE</div>
      </div>

      <div class="names fade d4">
        <div class="person">
          JOCELYN<br/>WILLIAMS
        </div>

        <div class="amp">&amp;</div>

        <div class="person">
          EDMUND<br/>JOHNSON
        </div>
      </div>

      <div class="date fade d5">22.08.25</div>

      <div class="note fade d5">Formal invitation to follow</div>
    </div>
  </section>
</body>
</html>
