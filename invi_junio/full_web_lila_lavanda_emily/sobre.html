<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación - Mis Quince Años</title>

    <style>
        /* Estilo global */
        @font-face {
            font-family: 'Nova Quinta';
            src: url('fonts/NovaQuinta_PERSONAL_USE_ONLY.otf') format('truetype');
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #FFFFFF;
            font-family: 'Arial', sans-serif;
        }

        .container {
            position: relative;
            width: 450px;
            height: 800px;
            background-image: url('img/sobre.png');
            background-size: cover;
            background-position: center;
            border-radius: 10px;
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.2);
            transform-origin: center;
        }

        .name {
            position: absolute;
            bottom: 180px;
            width: 100%;
            text-align: center;
            font-size: 70px;
            font-weight: 500;
            color: #203a8e;
            font-family: 'Nova Quinta', cursive;
        }

        .button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            background-image: url('img/sello.png');
            background-size: cover;
            background-position: center;
            background-color: transparent;
            border: none;
            outline: none;
            box-shadow: none;
            padding: 0;
            appearance: none;
            cursor: pointer;
            font-size: 20px;
            font-family: 'Baskerville', serif;
            font-style: italic;
            font-weight: 600;
            color: #000000;
            text-align: center;

            /* Efecto de latido */
            animation: heartbeat 1.4s ease-in-out infinite;
            transform-origin: center;
            filter: drop-shadow(0 0 8px rgba(255, 215, 120, 0.55));
        }

        .button:hover {
            animation: none;
            transform: translate(-50%, -50%) scale(1.18);
            filter: drop-shadow(0 0 14px rgba(255, 215, 120, 0.85));
        }

        .button:disabled {
            pointer-events: none;
            animation: none;
            opacity: 0.95;
        }

        @keyframes heartbeat {
            0% {
                transform: translate(-50%, -50%) scale(1);
                filter: drop-shadow(0 0 6px rgba(255, 215, 120, 0.45));
            }

            15% {
                transform: translate(-50%, -50%) scale(1.08);
                filter: drop-shadow(0 0 14px rgba(255, 215, 120, 0.75));
            }

            30% {
                transform: translate(-50%, -50%) scale(1);
                filter: drop-shadow(0 0 7px rgba(255, 215, 120, 0.5));
            }

            45% {
                transform: translate(-50%, -50%) scale(1.12);
                filter: drop-shadow(0 0 18px rgba(255, 215, 120, 0.9));
            }

            65% {
                transform: translate(-50%, -50%) scale(1);
                filter: drop-shadow(0 0 8px rgba(255, 215, 120, 0.55));
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
                filter: drop-shadow(0 0 6px rgba(255, 215, 120, 0.45));
            }
        }

        /* Animación de apertura desde el centro hacia afuera */
        .container.open {
            animation: openEnvelopeOutwards 1s forwards;
        }

        @keyframes openEnvelopeOutwards {
            0% {
                transform: scale(1) rotateX(0deg);
            }

            50% {
                transform: scale(1.05) rotateX(30deg) translateZ(10px);
            }

            100% {
                transform: scale(1.1) rotateX(180deg) translateZ(50px);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="container" id="envelope">
        <!-- <div class="name">Alessa</div> Ahora no editable -->
        <button class="button" id="openButton"><strong>ABRIR</strong></button>
    </div>

    <script>
        const button = document.getElementById('openButton');
        const envelope = document.getElementById('envelope');

        button.addEventListener('click', () => {
            button.disabled = true;
            envelope.classList.add('open');

            setTimeout(() => {
                window.location.href = 'invitacion.html';
            }, 1000);
        });
    </script>
</body>

</html>
