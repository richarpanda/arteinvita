<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación - Mis Quince Años</title>
    <style>
        /* =========================
       FUENTES / BASE
    ========================= */
        @font-face {
            font-family: 'Nova Quinta';
            src: url('fonts/NovaQuinta_PERSONAL_USE_ONLY.otf') format('truetype');
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
        }

        /* =========================
       PORTADA / SOBRE
    ========================= */
        .cover {
            position: relative;
            width: 450px;
            height: 800px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 6px 10px rgba(0, 0, 0, .20);
            background-image: url('galeria/bg_09.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* =========================
       IMAGEN SUPERIOR / ESPEJO
    ========================= */
        .title-img3 {
            position: absolute;
            left: 50%;
            top: 2%;
            width: 80%;
            height: auto;
            transform: translateX(-50%);
            z-index: 2;
            pointer-events: none;
            user-select: none;
            filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .35));
        }

        /* =========================
       IMAGEN XV
    ========================= */
        .title-img {
            position: absolute;
            left: 50%;
            top: 18%;
            width: 100%;
            height: auto;
            transform: translateX(-50%);
            z-index: 4;
            pointer-events: none;
            user-select: none;
            filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .35));
        }

        /* =========================
       BOTÓN / SELLO ENCIMA DE XV.PNG
    ========================= */
        .seal-btn {
            position: absolute;
            left: 50%;
            top: 80%;
            width: 150px;
            height: 150px;
            transform: translate(-50%, -50%);
            z-index: 8;
            border: none;
            background: transparent;
            padding: 0;
            cursor: pointer;
            outline: none;
            appearance: none;
            animation: sealHeartbeat 1.6s ease-in-out infinite;
            transition: transform .25s ease, filter .25s ease;
        }

        .seal-btn:hover {
            transform: translate(-50%, -50%) scale(1.08);
            filter: brightness(1.05);
        }

        .seal-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
            user-select: none;
            filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .35));
        }

        .seal-btn span {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-family: 'Baskerville', serif;
            font-style: italic;
            font-weight: 700;
            font-size: 20px;
            color: #ffffff;
            letter-spacing: .06em;
            text-shadow: 0 8px 18px rgba(0, 0, 0, .45);
            pointer-events: none;
        }

        @keyframes sealHeartbeat {
            0% {
                transform: translate(-50%, -50%) scale(1);
                filter: brightness(1);
            }

            14% {
                transform: translate(-50%, -50%) scale(1.08);
                filter: brightness(1.08);
            }

            28% {
                transform: translate(-50%, -50%) scale(1);
                filter: brightness(1);
            }

            42% {
                transform: translate(-50%, -50%) scale(1.08);
                filter: brightness(1.08);
            }

            70%,
            100% {
                transform: translate(-50%, -50%) scale(1);
                filter: brightness(1);
            }
        }

        /* =========================
       SOBRE
    ========================= */
        .envelope-wrap {
            position: absolute;
            left: 50%;
            bottom: 2%;
            width: min(92%, 430px);
            aspect-ratio: 1 / 0.72;
            display: grid;
            place-items: center;
            transform: translateX(-50%);
            transform-origin: center;
            z-index: 2;
        }

        .envelope-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
            user-select: none;
            filter: drop-shadow(0 18px 28px rgba(0, 0, 0, .35));
        }

        /* Animación de apertura */
        .envelope-wrap.open {
            animation: openEnvelopeOutwards 1s forwards;
        }

        @keyframes openEnvelopeOutwards {
            0% {
                transform: translateX(-50%) scale(1) rotateX(0deg);
            }

            50% {
                transform: translateX(-50%) scale(1.05) rotateX(30deg) translateZ(10px);
            }

            100% {
                transform: translateX(-50%) scale(1.1) rotateX(180deg) translateZ(50px);
                opacity: 0;
            }
        }

        /* =========================
       IMAGEN EXTRA / NOMBRE
    ========================= */
        .title-img2 {
            position: absolute;
            left: 50%;
            bottom: -10%;
            width: min(88%, 380px);
            height: auto;
            transform: translateX(-50%);
            z-index: 5;
            pointer-events: none;
            user-select: none;
            filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .35));
        }

        /* =========================
       RESPONSIVE
    ========================= */
        @media (max-width: 480px) {
            body {
                align-items: flex-start;
            }

            .cover {
                width: min(450px, 100vw);
                height: min(800px, 100vh);
                border-radius: 0;
            }

            .title-img {
                top: 40%;
                width: 100%;
            }

            .seal-btn {
                top: 75%;
                width: 135px;
                height: 135px;
            }

            .seal-btn span {
                font-size: 25px;
            }

            .envelope-wrap {
                width: min(94%, 430px);
                bottom: 2%;
            }
        }

        @media (max-width: 380px) {
            .seal-btn {
                width: 120px;
                height: 120px;
                top: 55%;
            }

            .seal-btn span {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>
    <main class="cover">
        <div class="stage">

         <!--   <img class="title-img3" src="img/espejo.png" alt="Mis XV Años" />-->

            <!-- 1) TÍTULO (imagen)-->
            <img class="title-img" src="img/xv.png" alt="Mis XV Años" />

            <!-- Sello/botón encima de xv.png -->
            <button class="seal-btn" id="openButton" aria-label="Abrir invitación">
                <img src="img/sello.png" alt="" aria-hidden="true" />
                <span>ABRIR</span>
            </button>

            <!-- 2) SOBRE -->
            <section class="envelope-wrap" id="envelope">
                <img class="envelope-img" src="img/envelope.png" alt="" aria-hidden="true" />
            </section>

            <!-- <img class="title-img2" src="img/melanie.png" alt="Mis XV Años" />-->

        </div>
    </main>

    <script>
        const button = document.getElementById('openButton');
        const envelope = document.getElementById('envelope');

        button.addEventListener('click', () => {
            envelope.classList.add('open'); // Agrega la clase para activar la animación
            setTimeout(() => {
                window.location.href = 'invitacion.html'; // Redirige después de la animación
            }, 1000); // Tiempo en milisegundos (coincide con la duración de la animación)
        });
    </script>
</body>

</html>
