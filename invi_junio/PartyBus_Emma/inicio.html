<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Partybus VIP | XV Emma</title>

  <!-- FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --gold: #d9b56d;
      --gold-soft: #f4dc9c;
      --purple: #b86cff;
      --purple-soft: #d8a6ff;
      --white: rgba(255, 255, 255, .96);
      --soft-white: rgba(255, 255, 255, .76);
      --dark: #030303;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: #000;
      font-family: "Montserrat", sans-serif;
      color: var(--white);
    }

    .poster {
      width: 100vw;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 18px;
      background: #000;
    }

    .poster::before,
    .poster::after {
      display: none;
    }

    .content {
      position: relative;
      z-index: 2;
      width: min(460px, 92vw);
      min-height: calc(100vh - 64px);
      border: 2px solid rgba(217, 181, 109, .88);
      padding: 34px 24px 28px;
      text-align: center;
      overflow: hidden;

      box-shadow:
        0 0 35px rgba(0, 0, 0, .6),
        inset 0 0 26px rgba(255, 255, 255, .04);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .content::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url("fondo.jpg") center center / cover no-repeat;
      filter: contrast(1.08) saturate(1.05);
      transform: scale(1.03);
      z-index: 0;
    }

    .content::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center 64%, rgba(149, 41, 255, .30), transparent 38%),
        linear-gradient(to bottom,
          rgba(0, 0, 0, .82) 0%,
          rgba(0, 0, 0, .58) 42%,
          rgba(0, 0, 0, .88) 100%);
      z-index: 1;
    }

    .content>* {
      position: relative;
      z-index: 2;
    }

    .top-content {
      width: 100%;
    }

    .logo-circle {
		top: 20%;
      width: 218px;
      height: 218px;
      margin: 0 auto 24px;
      border: 2px solid rgba(217, 181, 109, .75);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, .26);
      box-shadow: 0 0 18px rgba(184, 108, 255, .18);
      overflow: hidden;
    }

    .logo-circle-img {
		top: 60%;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .logo-xv {
      font-family: "Great Vibes", cursive;
      font-size: 34px;
      line-height: .9;
      color: var(--purple-soft);
      text-shadow: 0 0 8px rgba(184, 108, 255, .45);
    }

    .logo-name {
      font-family: "Great Vibes", cursive;
      font-size: 35px;
      line-height: 1;
      color: var(--purple-soft);
      text-shadow: 0 0 8px rgba(184, 108, 255, .45);
    }

    .main-title {
      margin: 0;
      font-family: "Playfair Display", serif;
      font-size: clamp(38px, 9vw, 56px);
      line-height: .95;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .03em;
      color: var(--gold-soft);
      text-shadow:
        0 0 8px rgba(184, 108, 255, .45),
        0 0 20px rgba(0, 0, 0, .85);
    }

    .subtitle {
      margin-top: 12px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--white);
    }

    .date-block {
      margin-top: 30px;
    }

    .event-date {
      font-family: "Playfair Display", serif;
      font-size: clamp(31px, 7vw, 45px);
      line-height: 1.1;
      color: var(--gold-soft);
      font-weight: 600;
      text-shadow: 0 0 14px rgba(0, 0, 0, .75);
    }

    .event-time {
      margin-top: 8px;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: .08em;
      color: var(--white);
    }

    .location-block {
      width: 100%;
      margin-top: 28px;
    }

    .location-label {
      font-size: 17px;
      font-weight: 700;
      color: var(--purple-soft);
      text-shadow: 0 0 8px rgba(184, 108, 255, .5);
    }

    .location-text {
      margin-top: 10px;
      font-size: clamp(17px, 4.7vw, 22px);
      line-height: 1.35;
      font-weight: 700;
      color: var(--white);
      text-shadow: 0 0 12px rgba(0, 0, 0, .8);
    }

    .bottom-content {
      width: 100%;
    }

    .countdown {
      margin: 22px auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .time-box {
      min-width: 64px;
      padding: 8px 5px;
      border: 1px solid rgba(217, 181, 109, .45);
      background: rgba(0, 0, 0, .28);
    }

    .num {
      font-family: "Playfair Display", serif;
      font-size: 24px;
      line-height: 1;
      color: var(--gold-soft);
    }

    .label {
      margin-top: 5px;
      font-size: 9px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--soft-white);
    }

    .rsvp-block {
      margin-top: 24px;
    }

    .rsvp-title-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .rsvp-line {
      width: 78px;
      height: 1px;
      background: rgba(217, 181, 109, .65);
    }

    .rsvp-title {
      font-size: 18px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--white);
    }

    .rsvp-number {
      margin-top: 8px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .08em;
      color: var(--gold-soft);
    }

    .whatsapp-confirm {
      margin-top: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 11px 20px;
      border: 1px solid rgba(217, 181, 109, .65);
      border-radius: 999px;
      color: var(--white);
      text-decoration: none;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .16em;
      text-transform: uppercase;
      background: rgba(184, 108, 255, .14);
      box-shadow: 0 0 22px rgba(184, 108, 255, .16);
      transition: all .3s ease;
    }

    .whatsapp-confirm:hover {
      background: rgba(184, 108, 255, .24);
      transform: translateY(-2px);
    }

    .whatsapp-icon {
      width: 16px;
      height: 16px;
    }

    .music-toggle {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 20;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(217, 181, 109, .55);
      background: rgba(0, 0, 0, .42);
      color: rgba(255, 255, 255, .92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 10px 26px rgba(0, 0, 0, .25);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all .3s ease;
    }

    .music-toggle:hover {
      background: rgba(184, 108, 255, .22);
      transform: translateY(-2px);
    }

    .music-toggle svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    .music-toggle .pause-icon {
      display: none;
    }

    .music-toggle.playing .play-icon {
      display: none;
    }

    .music-toggle.playing .pause-icon {
      display: block;
    }

    .fade {
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp .9s ease forwards;
    }

    .d1 {
      animation-delay: .1s;
    }

    .d2 {
      animation-delay: .25s;
    }

    .d3 {
      animation-delay: .4s;
    }

    .d4 {
      animation-delay: .55s;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: none;
      }
    }

    @media (max-width: 420px) {
      .poster {
        padding: 22px 14px;
      }

      .content {
        min-height: calc(100vh - 44px);
        padding: 28px 18px 24px;
      }

      .logo-circle {
        width: 104px;
        height: 104px;
        margin-bottom: 20px;
      }

      .logo-xv {
        font-size: 30px;
      }

      .logo-name {
        font-size: 31px;
      }

      .subtitle {
        font-size: 12px;
        letter-spacing: .18em;
      }

      .date-block {
        margin-top: 24px;
      }

      .location-block {
        margin-top: 24px;
      }

      .countdown {
        gap: 8px;
      }

      .time-box {
        min-width: 58px;
      }

      .rsvp-line {
        width: 58px;
      }
    }
  </style>
</head>

<body>

                d="M16.04 3C8.86 3 3.02 8.73 3.02 15.78c0 2.25.61 4.45 1.76 6.38L3 29l7.02-1.82a13.2 13.2 0 0 0 6.02 1.47C23.22 28.65 29.06 22.92 29.06 15.87 29.06 8.78 23.22 3 16.04 3Zm0 23.46c-1.92 0-3.8-.51-5.44-1.47l-.39-.23-4.17 1.08 1.11-4.01-.26-.41a11.27 11.27 0 0 1-1.7-5.64c0-5.84 4.86-10.59 10.85-10.59 5.98 0 10.85 4.79 10.85 10.68 0 5.84-4.87 10.59-10.85 10.59Zm5.95-7.91c-.33-.16-1.95-.94-2.25-1.05-.3-.11-.52-.16-.74.16-.22.32-.85 1.05-1.04 1.27-.19.21-.38.24-.71.08-.33-.16-1.39-.5-2.65-1.6-.98-.86-1.64-1.92-1.83-2.24-.19-.32-.02-.5.14-.66.15-.14.33-.37.49-.55.16-.19.22-.32.33-.53.11-.21.05-.4-.03-.56-.08-.16-.74-1.75-1.01-2.4-.27-.64-.54-.55-.74-.56h-.63c-.22 0-.57.08-.87.4-.3.32-1.14 1.09-1.14 2.66 0 1.57 1.17 3.08 1.33 3.29.16.21 2.3 3.45 5.58 4.83.78.33 1.39.53 1.86.68.78.24 1.49.21 2.05.13.63-.09 1.95-.78 2.23-1.54.27-.75.27-1.4.19-1.54-.08-.13-.3-.21-.63-.37Z" />

  <script>
    /* ===============================
       FECHA DEL EVENTO
       Formato: Año, Mes-1, Día, Hora, Minutos, Segundos
       Julio es mes 6 porque enero es 0.
    =============================== */

    const eventDate = new Date(2026, 6, 10, 15, 0, 0);

    const daysEl = document.getElementById("days");
    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const secondsEl = document.getElementById("seconds");

    function updateCountdown() {
      const now = Date.now();
      const distance = eventDate.getTime() - now;

      if (distance <= 0) {
        daysEl.textContent = "00";
        hoursEl.textContent = "00";
        minutesEl.textContent = "00";
        secondsEl.textContent = "00";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      daysEl.textContent = String(days).padStart(2, "0");
      hoursEl.textContent = String(hours).padStart(2, "0");
      minutesEl.textContent = String(minutes).padStart(2, "0");
      secondsEl.textContent = String(seconds).padStart(2, "0");
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    /* ===============================
       MÚSICA
       Archivo requerido en la misma carpeta:
       cancion.mp3
    =============================== */

    const bgMusic = document.getElementById("bgMusic");
    const musicToggle = document.getElementById("musicToggle");
    let musicStarted = false;

    bgMusic.volume = 0.75;

    function setMusicButtonState() {
      if (!bgMusic.paused) {
        musicToggle.classList.add("playing");
        musicToggle.setAttribute("aria-label", "Pausar música");
      } else {
        musicToggle.classList.remove("playing");
        musicToggle.setAttribute("aria-label", "Reproducir música");
      }
    }

    async function playMusic() {
      try {
        await bgMusic.play();
        musicStarted = true;
        setMusicButtonState();
      } catch (error) {
        setMusicButtonState();
      }
    }

    function pauseMusic() {
      bgMusic.pause();
      setMusicButtonState();
    }

    musicToggle.addEventListener("click", function (event) {
      event.stopPropagation();

      if (bgMusic.paused) {
        playMusic();
      } else {
        pauseMusic();
      }
    });

    window.addEventListener("load", playMusic);

    ["click", "touchstart"].forEach(function (evt) {
      document.addEventListener(evt, function unlockMusic() {
        if (!musicStarted) {
          playMusic();
        }
      }, { once: true, passive: true });
    });

    bgMusic.addEventListener("play", setMusicButtonState);
    bgMusic.addEventListener("pause", setMusicButtonState);
  </script>
