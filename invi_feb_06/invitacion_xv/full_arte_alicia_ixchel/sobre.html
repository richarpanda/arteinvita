<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invitación - Mis Quince Años</title>

    <style>
        @font-face {
            font-family: 'Nova Quinta';
            src: url('fonts/NovaQuinta_PERSONAL_USE_ONLY.otf') format('truetype');
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #FFFFFF;
            font-family: 'Arial', sans-serif;
        }

        .container {
            position: relative;
            width: 450px;
            height: 800px;
            background-image: url('img/sobre.png');
            background-size: cover;
            background-position: center;
            border-radius: 10px;
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.2);
            transform-origin: center;
        }

        .name {
            position: absolute;
            bottom: 200px;
            width: 100%;
            text-align: center;
            font-size: 65px;
            font-weight: 500;
            color: #16ACD9;
            font-family: 'Nova Quinta', cursive;
        }

        .button {
            position: absolute;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            background-image: url('img/Sin-título-2.png');
            background-size: cover;
            background-position: center;
            background-color: transparent;
            border: none;
            outline: none;
            box-shadow: none;
            padding: 0;
            appearance: none;
            cursor: pointer;
            transition: transform 0.3s ease;
            font-size: 16px;
            font-family: 'Baskerville', serif;
            font-style: italic;
            font-weight: 600;
            color: #6F4509;
            text-align: center;
        }

        .button:hover {
            transform: translate(-50%, -50%) scale(1.2);
        }

        .container.open {
            animation: openEnvelopeOutwards 1s forwards;
        }

        @keyframes openEnvelopeOutwards {
            0% {
                transform: scale(1) rotateX(0deg);
            }

            50% {
                transform: scale(1.05) rotateX(30deg) translateZ(10px);
            }

            100% {
                transform: scale(1.1) rotateX(180deg) translateZ(50px);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="container" id="envelope">
        <!-- opcional: si quieres el nombre -->
        <div class="name">Ixchel</div> 
        <button class="button" id="openButton" type="button">ABRIR</button>
    </div>

    <script>
        const button = document.getElementById('openButton');
        const envelope = document.getElementById('envelope');

        button.addEventListener('click', () => {
            localStorage.setItem('autoplayUnlocked', '1');

            envelope.classList.add('open');
            setTimeout(() => {
                window.location.href = 'invitacion.html';
            }, 1000);
        });
    </script>
</body>

</html>
