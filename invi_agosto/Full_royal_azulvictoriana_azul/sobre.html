<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación - Mis Quince Años</title>
    <style>
        /* Estilo global */
        @font-face {
            font-family: 'Nova Quinta';
            src: url('fonts/NovaQuinta_PERSONAL_USE_ONLY.otf') format('truetype');
            /* Asegúrate de que el archivo esté en la carpeta correcta */
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #FFFFFF;
            font-family: 'Arial', sans-serif;
        }

        .container {
            position: relative;
            width: 450px;
            height: 800px;
            background-image: url('img/sobre.png');
            /* Imagen del sobre */
            background-size: cover;
            background-position: center;
            border-radius: 10px;
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.2);
            transform-origin: center;
            /* Punto de giro centrado */
        }

        .name {
            position: absolute;
            bottom: 100px;
            width: 100%;
            text-align: center;
            font-size: 90px;
            font-weight: 500;
            font-family: 'Nova Quinta', cursive;

            background: linear-gradient(180deg,
                    #ffffff 0%,
                    #edf0f2 18%,
                    #c9ced3 38%,
                    #8c9298 55%,
                    #dfe3e6 72%,
                    #656b71 100%);

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;

            filter:
                drop-shadow(0 3px 2px rgba(54, 57, 61, 0.78)) drop-shadow(0 6px 6px rgba(39, 42, 46, 0.58)) drop-shadow(0 10px 12px rgba(22, 24, 27, 0.38));
        }

        .button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            width: 150px;
            height: 150px;

            background-image: url('img/sello.png');
            background-size: cover;
            background-position: center;
            background-color: transparent;

            border: none;
            outline: none;
            box-shadow: none;
            padding: 0;
            appearance: none;

            cursor: pointer;

            font-size: 20px;
            font-family: 'Baskerville', serif;
            font-style: italic;
            font-weight: 600;
            color: #000000;
            text-align: center;

            animation: latidoButton 1.4s ease-in-out infinite;
        }

        .button:hover {
            animation-play-state: paused;
            transform: translate(-50%, -50%) scale(1.18);
        }

        .button:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        /* LATIDO DEL SELLO */

        @keyframes latidoButton {

            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
            }

            15% {
                transform: translate(-50%, -50%) scale(1.10);
            }

            30% {
                transform: translate(-50%, -50%) scale(1);
            }

            45% {
                transform: translate(-50%, -50%) scale(1.07);
            }

            60% {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* Animación de apertura desde el centro hacia afuera */
        .container.open {
            animation: openEnvelopeOutwards 1s forwards;
        }

        @keyframes openEnvelopeOutwards {
            0% {
                transform: scale(1) rotateX(0deg);
                /* Estado inicial */
            }

            50% {
                transform: scale(1.05) rotateX(30deg) translateZ(10px);
                /* Expande y levanta */
            }

            100% {
                transform: scale(1.1) rotateX(180deg) translateZ(50px);
                /* Apertura completa */
                opacity: 0;
                /* Desvanece el sobre al finalizar */
            }
        }
    </style>
</head>

<body>
    <div class="container" id="envelope">
        <div class="name">Azul</div> <!-- Ahora no editable -->
        <button class="button" id="openButton">ABRIR</button>
    </div>

    <script>
        const button = document.getElementById('openButton');
        const envelope = document.getElementById('envelope');

        button.addEventListener('click', () => {
            envelope.classList.add('open'); // Agrega la clase para activar la animación
            setTimeout(() => {
                window.location.href = 'invitacion.html'; // Redirige después de la animación
            }, 1000); // Tiempo en milisegundos (coincide con la duración de la animación)
        });
    </script>
</body>

</html>
