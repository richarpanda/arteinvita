<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación - Mis Quince Años</title>
    <style>
        /* Estilo global */
        @font-face {
            font-family: 'Nova Quinta';
            src: url('fonts/NovaQuinta_PERSONAL_USE_ONLY.otf') format('truetype');
            /* Asegúrate de que el archivo esté en la carpeta correcta */
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #FFFFFF;
            font-family: 'Arial', sans-serif;
        }

        .container {
            position: relative;
            width: 450px;
            height: 800px;
            background-image: url('img/sobre.png');
            /* Imagen del sobre */
            background-size: cover;
            background-position: center;
            border-radius: 10px;
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.2);
            transform-origin: center;
            /* Punto de giro centrado */
        }

        .name {
            position: absolute;
            bottom: 80px;
            width: 100%;
            text-align: center;
            font-size: 70px;
            font-weight: 500;
            font-family: 'Baskerville', 'Georgia', 'Times New Roman', serif;

            background: linear-gradient(180deg,
                    #fff7c7 0%,
                    #f5dc82 18%,
                    #d7ab38 38%,
                    #b98218 55%,
                    #e8c85d 72%,
                    #9b6b12 100%);

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;

            filter:
                drop-shadow(0 3px 2px rgba(58, 36, 4, 0.75)) drop-shadow(0 6px 6px rgba(45, 26, 2, 0.55)) drop-shadow(0 10px 12px rgba(35, 20, 0, 0.35));
        }

        .button {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            background-image: url('img/sello.png');
            background-size: cover;
            background-position: center;
            background-color: transparent;
            border: none;
            outline: none;
            box-shadow: none;
            padding: 0;
            appearance: none;
            cursor: pointer;
            font-size: 20px;
            font-family: 'Baskerville', serif;
            font-style: italic;
            font-weight: 600;
            color: #000000;
            text-align: center;

            /* Efecto de latido */
            animation: heartbeat 1.4s ease-in-out infinite;
            transform-origin: center;
            filter: drop-shadow(0 0 8px rgba(255, 215, 120, 0.55));
        }

        .button:hover {
            animation: none;
            transform: translate(-50%, -50%) scale(1.18);
            filter: drop-shadow(0 0 14px rgba(255, 215, 120, 0.85));
        }

        .button:disabled {
            pointer-events: none;
            animation: none;
            opacity: 0.95;
        }

        @keyframes heartbeat {
            0% {
                transform: translate(-50%, -50%) scale(1);
                filter: drop-shadow(0 0 6px rgba(255, 215, 120, 0.45));
            }

            15% {
                transform: translate(-50%, -50%) scale(1.08);
                filter: drop-shadow(0 0 14px rgba(255, 215, 120, 0.75));
            }

            30% {
                transform: translate(-50%, -50%) scale(1);
                filter: drop-shadow(0 0 7px rgba(255, 215, 120, 0.5));
            }

            45% {
                transform: translate(-50%, -50%) scale(1.12);
                filter: drop-shadow(0 0 18px rgba(255, 215, 120, 0.9));
            }

            65% {
                transform: translate(-50%, -50%) scale(1);
                filter: drop-shadow(0 0 8px rgba(255, 215, 120, 0.55));
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
                filter: drop-shadow(0 0 6px rgba(255, 215, 120, 0.45));
            }
        }

        /* Animación de apertura desde el centro hacia afuera */
        .container.open {
            animation: openEnvelopeOutwards 1s forwards;
        }

        @keyframes openEnvelopeOutwards {
            0% {
                transform: scale(1) rotateX(0deg);
                /* Estado inicial */
            }

            50% {
                transform: scale(1.05) rotateX(30deg) translateZ(10px);
                /* Expande y levanta */
            }

            100% {
                transform: scale(1.1) rotateX(180deg) translateZ(50px);
                /* Apertura completa */
                opacity: 0;
                /* Desvanece el sobre al finalizar */
            }
        }
    </style>
</head>

<body>
    <div class="container" id="envelope">
        <div class="name">Héctor</div> <!-- Ahora no editable -->
        <button class="button" id="openButton">ABRIR</button>
    </div>

    <script>
        const button = document.getElementById('openButton');
        const envelope = document.getElementById('envelope');

        button.addEventListener('click', () => {
            envelope.classList.add('open'); // Agrega la clase para activar la animación
            setTimeout(() => {
                window.location.href = 'invitacion.html'; // Redirige después de la animación
            }, 1000); // Tiempo en milisegundos (coincide con la duración de la animación)
        });
    </script>
</body>

</html>
